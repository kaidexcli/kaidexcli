<svg width="1000" height="14" viewBox="0 0 1000 14" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="auroraBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0"/>
      <stop offset="12%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#00f5a0" stop-opacity="1"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.85"/>
      <stop offset="88%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coreBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#f0fdf4" stop-opacity="1"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="beamGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Sleek Dark Container Capsule -->
  <rect width="1000" height="14" rx="7" fill="#040812"/>
  
  <!-- Aurora Outer Aura -->
  <rect x="25" y="5" width="950" height="4" rx="2" fill="url(#auroraBeam)" filter="url(#beamGlow)" opacity="0.95"/>
  
  <!-- Aurora Core Bright Line -->
  <rect x="120" y="5.5" width="760" height="3" rx="1.5" fill="url(#coreBeam)" opacity="0.9"/>
  
  <!-- Central Diamond Accent -->
  <g transform="translate(500, 7)">
    <path d="M 0,-4.5 L 4.5,0 L 0,4.5 L -4.5,0 Z" fill="#ffffff" filter="url(#beamGlow)"/>
    <circle cx="0" cy="0" r="1.5" fill="#00f5a0"/>
  </g>

  <!-- Side Star Node Accents -->
  <g transform="translate(250, 7)">
    <path d="M 0,-2.5 L 2.5,0 L 0,2.5 L -2.5,0 Z" fill="#00e5ff" opacity="0.85"/>
  </g>
  <g transform="translate(750, 7)">
    <path d="M 0,-2.5 L 2.5,0 L 0,2.5 L -2.5,0 Z" fill="#00e5ff" opacity="0.85"/>
  </g>
</svg>